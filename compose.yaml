services:
  opencode2api:
    image: ${OPENCODE2API_IMAGE:-ghcr.io/jasonxu114514/opencode2api:latest}
    pull_policy: ${OPENCODE2API_PULL:-always}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      CONFIG_PATH: /var/lib/opencode2api/config.json
      CONFIG_SEED_PATH: /run/config/opencode2api.json
      LISTEN_ADDRESS: 0.0.0.0:8080
      WEBUI_LISTEN_ADDRESS: 0.0.0.0:8081
    ports:
      - "${OPENCODE2API_PORT:-8080}:8080"
      - "${OPENCODE2API_WEBUI_PORT:-8081}:8081"
    configs:
      - source: opencode2api_config
        target: /run/config/opencode2api.json
    volumes:
      - opencode2api-state:/var/lib/opencode2api
    tmpfs:
      - /tmp

configs:
  opencode2api_config:
    file: ./config.json

volumes:
  opencode2api-state:
