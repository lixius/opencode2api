<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>opencode2api Control</title>
  <style>
    :root{color-scheme:dark;--bg:#091014;--panel:#111b20;--panel2:#17242a;--line:#263940;--text:#ecf5f2;--muted:#8fa7a2;--accent:#43d6a3;--accent2:#66a8ff;--bad:#ff6b7a;--warn:#f1bd5a;--shadow:0 18px 55px #0006}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -15%,#164535 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);background:#101b20ee;border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow)}.brand{font-size:24px;font-weight:750;letter-spacing:-.5px}.brand span{color:var(--accent)}.sub{color:var(--muted);margin:7px 0 25px}.field{display:grid;gap:7px;margin:13px 0}.field label{color:#b8cac6;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.07em}.input,input,textarea,select{width:100%;background:#0c1519;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px 12px;outline:none}.input:focus,input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:90px}.primary,.ghost,.danger{border:0;border-radius:9px;padding:10px 15px;font-weight:700}.primary{background:var(--accent);color:#062219}.ghost{background:#1a2a30;color:var(--text);border:1px solid var(--line)}.danger{background:#402027;color:#ffb6bd}.wide{width:100%}.error{color:#ff9ca6;min-height:20px}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:25px 18px;background:#0b1418cc;backdrop-filter:blur(12px)}.sidebar .brand{padding:0 8px 24px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 13px;border-radius:9px}.nav button.active,.nav button:hover{background:#17272c;color:var(--text)}.sidebar-foot{position:absolute;left:18px;right:18px;bottom:20px;color:var(--muted);font-size:12px}.main{min-width:0;padding:28px 34px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.topbar h1{font-size:24px;margin:0}.toolbar{display:flex;gap:9px;align-items:center}.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:99px;background:#153027;color:#8dffcf;font-size:12px}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}.notice{border:1px solid #725b27;background:#2c2515;color:#f4d691;border-radius:10px;padding:11px 14px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.section{background:linear-gradient(145deg,#121e23,#0e181c);border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 25px #0002}.card{padding:17px}.card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.metric{font-size:27px;font-weight:750;margin-top:8px}.metric small{font-size:12px;color:var(--muted);font-weight:500}.section{padding:20px;margin-top:15px}.section h2{font-size:16px;margin:0 0 15px}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #203139;padding:9px 7px}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.ok{color:var(--accent)}.bad{color:var(--bad)}.warn{color:var(--warn)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.form-grid .full{grid-column:1/-1}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.chip{display:flex;gap:8px;align-items:center;background:#1a2a30;border:1px solid var(--line);padding:5px 8px;border-radius:7px;color:#bcd0cb;font-family:ui-monospace,monospace}.chip button{border:0;background:transparent;color:#f8959e;padding:0}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.logs{height:58vh;overflow:auto;background:#081014;border:1px solid var(--line);border-radius:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.log{display:grid;grid-template-columns:90px 55px 110px minmax(180px,1fr);gap:10px;padding:7px 10px;border-bottom:1px solid #162329}.log:hover{background:#101d22}.log .time,.log .component{color:var(--muted)}.log .level{font-weight:800}.log .fields{grid-column:4;color:#86a29b;white-space:pre-wrap;overflow-wrap:anywhere}.filters{display:grid;grid-template-columns:150px 170px 1fr auto;gap:9px;margin-bottom:11px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:5}.modal-card{width:min(720px,100%);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c8ded8}.toast{position:fixed;right:24px;bottom:24px;background:#183129;border:1px solid #2c5a49;color:#baffdf;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);z-index:10}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(4,1fr)}.sidebar-foot{display:none}.main{padding:22px 16px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid,.split,.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.filters{grid-template-columns:1fr}.log{grid-template-columns:75px 48px 1fr}.log .component{display:none}.log .fields{grid-column:1/-1}.nav button{text-align:center;padding:8px 3px}.topbar{align-items:flex-start;gap:12px;flex-direction:column}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <form id="login-form" class="login-card">
      <div class="brand">opencode<span>2api</span></div><div class="sub">Control plane · 管理登录</div>
      <div class="field"><label>账号</label><input id="login-user" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
      <div id="login-error" class="error"></div><button class="primary wide">登录控制台</button>
    </form>
  </section>
  <div id="app" class="layout hidden">
    <aside class="sidebar"><div class="brand">opencode<span>2api</span></div><nav class="nav">
      <button data-page="overview" class="active">总览</button><button data-page="config">配置</button><button data-page="logs">实时日志</button><button data-page="account">账号</button>
    </nav><div class="sidebar-foot"><div id="version">version —</div></div></aside>
    <main class="main">
	  <header class="topbar"><div><h1 id="page-title">运行总览</h1><div class="sub" id="page-sub">最近一小时的服务状态</div></div><div class="toolbar"><span class="badge">Live</span><button id="logout" class="ghost">退出登录</button></div></header>
	  <div id="restart-notice" class="notice hidden"></div>
      <section id="page-overview" class="page">
		<div class="grid"><div class="card"><div class="label">请求总数</div><div id="m-total" class="metric">—</div></div><div class="card"><div class="label">成功率</div><div id="m-rate" class="metric">—</div></div><div class="card"><div class="label">P95 延迟</div><div id="m-p95" class="metric">—</div></div><div class="card"><div class="label">活跃 / 流式</div><div id="m-active" class="metric">—</div></div></div>
		<div class="split"><div class="section"><h2>Proxy 状态</h2><table class="table"><thead><tr><th>路由</th><th>状态</th><th>绑定</th></tr></thead><tbody id="proxy-table"></tbody></table></div><div class="section"><h2>Key 池</h2><table class="table"><thead><tr><th>ID</th><th>Tier</th><th>状态</th></tr></thead><tbody id="key-table"></tbody></table></div></div>
		<div class="section"><h2>最近一小时聚合</h2><div id="breakdowns" class="split"></div></div>
      </section>
      <section id="page-config" class="page hidden">
        <form id="config-form">
		  <div class="section"><h2>服务与管理端</h2><div class="form-grid"><div class="field"><label>API Listen</label><input id="c-listen"></div><div class="field"><label>优先 Tier</label><select id="c-prefer"><option value="go">Go</option><option value="zen">Zen</option></select></div><div class="field"><label>WebUI Listen</label><input id="c-web-listen"></div><div class="field"><label>Session TTL（分钟）</label><input id="c-session" type="number"></div><div class="field"><label><input id="c-web-enabled" type="checkbox" style="width:auto"> 启用 WebUI（修改需重启）</label></div></div></div>
		  <div class="section"><h2>密钥池</h2><div class="form-grid"><div class="field full"><label>Server Keys</label><div id="server_keys-chips" class="chips"></div><textarea id="server_keys-new" placeholder="每行新增一个 key"></textarea></div><div class="field"><label>Zen Keys</label><div id="zen_keys-chips" class="chips"></div><textarea id="zen_keys-new" placeholder="每行新增一个 key"></textarea></div><div class="field"><label>Go Keys</label><div id="go_keys-chips" class="chips"></div><textarea id="go_keys-new" placeholder="每行新增一个 key"></textarea></div></div><button id="reveal" type="button" class="ghost">二次验证并查看完整值</button></div>
		  <div class="section"><h2>Proxy</h2><div id="proxies-chips" class="chips"></div><div class="form-grid"><div class="field"><label>新增 Proxy（每行一个）</label><textarea id="proxies-new" placeholder="direct\nhttp://user:pass@host:port"></textarea></div><div class="field"><label>Proxy File</label><input id="c-proxyfile" placeholder="proxies.txt"></div></div></div>
		  <div class="section"><h2>上游与重试</h2><div class="form-grid"><div class="field"><label>Zen URL</label><input id="c-up-zen"></div><div class="field"><label>Go URL</label><input id="c-up-go"></div><div class="field"><label>最大尝试次数</label><input id="c-attempts" type="number"></div><div class="field"><label>请求超时（秒）</label><input id="c-timeout" type="number"></div><div class="field"><label>模型刷新（秒）</label><input id="c-refresh" type="number"></div><div class="field"><label>模型协议覆盖（JSON）</label><textarea id="c-protocols" spellcheck="false">{}</textarea></div></div></div>
		  <div class="section"><h2>性能与日志</h2><div class="form-grid"><div class="field"><label>Max Idle Conns</label><input id="c-idle" type="number"></div><div class="field"><label>Max Idle / Host</label><input id="c-idle-host" type="number"></div><div class="field"><label>Max Conns / Host（0 无限制）</label><input id="c-max-host" type="number"></div><div class="field"><label>Idle Timeout（秒）</label><input id="c-idle-timeout" type="number"></div><div class="field"><label>Connect Timeout（秒）</label><input id="c-connect" type="number"></div><div class="field"><label>Failure Cooldown（秒）</label><input id="c-cooldown" type="number"></div><div class="field"><label>日志级别</label><select id="c-level"><option>debug</option><option>info</option><option>warn</option><option>error</option></select></div><div class="field"><label>日志 Ring Size</label><input id="c-ring" type="number"></div></div><div class="actions"><button id="reload-config" type="button" class="ghost">从磁盘重载</button><button class="primary">验证、保存并立即应用</button></div></div>
        </form>
      </section>
	  <section id="page-logs" class="page hidden"><div class="filters"><select id="log-level"><option value="">全部级别</option><option>debug</option><option>info</option><option>warn</option><option>error</option></select><input id="log-component" placeholder="模块"><input id="log-search" placeholder="搜索事件、request ID、模型…"><button id="log-pause" class="ghost">暂停</button></div><div id="log-list" class="logs"></div></section>
	  <section id="page-account" class="page hidden"><form id="account-form" class="section" style="max-width:620px"><h2>更新管理账号</h2><div class="field"><label>新账号（留空保持不变）</label><input id="a-user"></div><div class="field"><label>当前密码</label><input id="a-current" type="password" required></div><div class="field"><label>新密码（留空保持不变，至少 10 个字符）</label><input id="a-new" type="password"></div><div class="actions"><button class="primary">更新并重新登录</button></div></form></section>
    </main>
  </div>
	<div id="modal" class="modal hidden"><div class="modal-card"><div class="topbar"><h2>敏感配置</h2><button id="modal-close" class="ghost">关闭</button></div><pre id="modal-content"></pre></div></div><div id="toast" class="toast hidden"></div>
  <script>
	const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)]; let csrf='',config=null,logEvents=[],eventSource=null,paused=false,monitorTimer=null,logRenderPending=false;
  async function api(path,options={}){options.headers={...(options.headers||{}),'Accept':'application/json'};if(options.body){options.headers['Content-Type']='application/json'}if(csrf&&!['GET','HEAD'].includes(options.method||'GET'))options.headers['X-CSRF-Token']=csrf;const response=await fetch(path,options);if(response.status===401){showLogin();throw new Error('登录已失效')}if(response.status===204)return null;const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error?.message||`HTTP ${response.status}`);return data}
  function toast(message,bad=false){const el=$('#toast');el.textContent=message;el.style.background=bad?'#402027':'#183129';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}
  function showLogin(){csrf='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden');if(eventSource)eventSource.close();clearInterval(monitorTimer)}
  async function boot(){try{const s=await api('/api/auth/session');csrf=s.csrf_token;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await loadConfig();await refreshMonitor();monitorTimer=setInterval(refreshMonitor,3000);connectLogs()}catch(e){showLogin()}}
  $('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-error').textContent='';try{const s=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('#login-user').value,password:$('#login-pass').value})});csrf=s.csrf_token;$('#login-pass').value='';$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await loadConfig();await refreshMonitor();monitorTimer=setInterval(refreshMonitor,3000);connectLogs()}catch(err){$('#login-error').textContent=err.message}});
  $('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}finally{showLogin()}};
	const titles={overview:['运行总览','最近一小时的服务状态'],config:['配置中心','验证后原子保存并立即应用'],logs:['实时日志','结构化事件流'],account:['账号安全','修改后会撤销所有登录会话']};
  $$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.toggle('active',x===b));$$('.page').forEach(x=>x.classList.add('hidden'));$(`#page-${b.dataset.page}`).classList.remove('hidden');$('#page-title').textContent=titles[b.dataset.page][0];$('#page-sub').textContent=titles[b.dataset.page][1]});
  async function loadConfig(){config=await api('/api/config');fillConfig(config)}
  function fillConfig(c){$('#c-listen').value=c.listen;$('#c-prefer').value=c.prefer;$('#c-web-listen').value=c.webui.listen;$('#c-session').value=c.webui.session_ttl_minutes;$('#c-web-enabled').checked=c.webui.enabled;$('#c-proxyfile').value=c.proxyfile;$('#c-up-zen').value=c.upstream.zen;$('#c-up-go').value=c.upstream.go;$('#c-attempts').value=c.retry.max_attempts;$('#c-timeout').value=c.retry.timeout_seconds;$('#c-refresh').value=c.models.refresh_seconds;$('#c-protocols').value=JSON.stringify(c.models.protocols||{},null,2);$('#c-idle').value=c.performance.max_idle_conns;$('#c-idle-host').value=c.performance.max_idle_conns_per_host;$('#c-max-host').value=c.performance.max_conns_per_host;$('#c-idle-timeout').value=c.performance.idle_conn_timeout_seconds;$('#c-connect').value=c.performance.connect_timeout_seconds;$('#c-cooldown').value=c.performance.failure_cooldown_seconds;$('#c-level').value=c.logging.level;$('#c-ring').value=c.logging.ring_size;['server_keys','zen_keys','go_keys','proxies'].forEach(renderChips);const restart=$('#restart-notice');if(c.restart_required_fields?.length){restart.textContent=`以下配置已保存但尚未生效：${c.restart_required_fields.join(', ')}。当前 API ${c.effective.listen}、WebUI ${c.effective.webui_listen}。请重启服务。`;restart.classList.remove('hidden')}else restart.classList.add('hidden')}
  function renderChips(name){const host=$(`#${name}-chips`);host.innerHTML='';(config[name]||[]).forEach(item=>{const chip=document.createElement('span');chip.className='chip';chip.dataset.id=item.id;chip.innerHTML=`<span></span><button type="button" title="移除">×</button>`;chip.querySelector('span').textContent=item.display;chip.querySelector('button').onclick=()=>chip.remove();host.appendChild(chip)})}
  function secretInputs(name){const kept=[...$(`#${name}-chips`).children].map(x=>({id:x.dataset.id}));const added=$(`#${name}-new`).value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(value=>({value}));return kept.concat(added)}
  function number(id){return Number($(id).value)}
  $('#config-form').addEventListener('submit',async e=>{e.preventDefault();try{const update={listen:$('#c-listen').value,server_keys:secretInputs('server_keys'),zen_keys:secretInputs('zen_keys'),go_keys:secretInputs('go_keys'),proxies:secretInputs('proxies'),proxyfile:$('#c-proxyfile').value,prefer:$('#c-prefer').value,upstream:{zen:$('#c-up-zen').value,go:$('#c-up-go').value},retry:{max_attempts:number('#c-attempts'),timeout_seconds:number('#c-timeout')},models:{refresh_seconds:number('#c-refresh'),protocols:JSON.parse($('#c-protocols').value||'{}')},performance:{max_idle_conns:number('#c-idle'),max_idle_conns_per_host:number('#c-idle-host'),max_conns_per_host:number('#c-max-host'),idle_conn_timeout_seconds:number('#c-idle-timeout'),connect_timeout_seconds:number('#c-connect'),failure_cooldown_seconds:number('#c-cooldown')},logging:{level:$('#c-level').value,ring_size:number('#c-ring')},webui:{enabled:$('#c-web-enabled').checked,listen:$('#c-web-listen').value,username:config.webui.username,session_ttl_minutes:number('#c-session')}};const result=await api('/api/config',{method:'PUT',body:JSON.stringify(update)});config=result.config;['server_keys','zen_keys','go_keys','proxies'].forEach(n=>$(`#${n}-new`).value='');fillConfig(config);toast(result.result.restart_required?`已应用；${result.result.restart_fields.join(', ')} 需重启`:'配置已保存并立即应用')}catch(err){toast(err.message,true)}});
	$('#reload-config').onclick=async()=>{try{const r=await api('/api/config/reload',{method:'POST',body:'{}'});await loadConfig();toast(r.restart_required?'磁盘配置已重载，监听字段需重启':'磁盘配置已重载')}catch(e){toast(e.message,true)}};
	$('#reveal').onclick=async()=>{const password=prompt('请再次输入管理密码');if(password===null)return;try{const values=await api('/api/config/reveal',{method:'POST',body:JSON.stringify({password})});$('#modal-content').textContent=JSON.stringify(values,null,2);$('#modal').classList.remove('hidden')}catch(e){toast(e.message,true)}};$('#modal-close').onclick=()=>{$('#modal').classList.add('hidden');$('#modal-content').textContent=''};
	$('#account-form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/account',{method:'PUT',body:JSON.stringify({current_password:$('#a-current').value,username:$('#a-user').value,new_password:$('#a-new').value})});toast('账号已更新，请重新登录');setTimeout(showLogin,800)}catch(err){toast(err.message,true)}});
	async function refreshMonitor(){try{const data=await api('/api/monitor');$('#version').textContent=`version ${data.version}`;const m=data.metrics;$('#m-total').textContent=m.last_hour.total.toLocaleString();$('#m-rate').innerHTML=`${(m.last_hour.success_rate*100).toFixed(1)}<small>%</small>`;$('#m-p95').innerHTML=`${m.last_hour.p95_ms||0}<small> ms</small>`;$('#m-active').innerHTML=`${m.active_requests}<small> / ${m.active_streams}</small>`;$('#proxy-table').innerHTML=data.resources.proxies.map(p=>`<tr><td>${esc(p.address)}</td><td class="${p.healthy?'ok':'bad'}">${p.healthy?'正常':'不可用'}</td><td>Z ${p.zen_keys} · G ${p.go_keys}</td></tr>`).join('')||'<tr><td colspan="3">无数据</td></tr>';$('#key-table').innerHTML=data.resources.keys.map(k=>`<tr><td>${k.id}</td><td>${k.tier}</td><td class="${k.cooldown_until?'warn':'ok'}">${k.cooldown_until?'冷却中':'可用'}</td></tr>`).join('')||'<tr><td colspan="3">无数据</td></tr>';$('#breakdowns').innerHTML=breakdown('端点',m.endpoints)+breakdown('状态码',m.statuses)+breakdown('模型',m.models)+breakdown('Tier',m.tiers)+breakdown('上游Key',m.keys)}catch(e){}}
	function breakdown(title,data){return `<div><h3>${title}</h3><table class="table">${Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')||'<tr><td>暂无请求</td></tr>'}</table></div>`}
	function connectLogs(){if(eventSource)eventSource.close();eventSource=new EventSource('/api/logs/stream');eventSource.addEventListener('log',e=>{const item=JSON.parse(e.data);logEvents.push(item);if(logEvents.length>2000)logEvents.shift();if(!paused&&!logRenderPending){logRenderPending=true;requestAnimationFrame(()=>{logRenderPending=false;renderLogs()})}});eventSource.addEventListener('gap',()=>toast('较早的日志已从内存清除',true))}
  function renderLogs(){const level=$('#log-level').value,component=$('#log-component').value.toLowerCase(),query=$('#log-search').value.toLowerCase();const rows=logEvents.filter(x=>(!level||x.level===level)&&(!component||(x.component||'').toLowerCase().includes(component))&&(!query||JSON.stringify(x).toLowerCase().includes(query))).slice(-500);$('#log-list').innerHTML=rows.map(x=>`<div class="log"><span class="time">${new Date(x.time).toLocaleTimeString()}</span><span class="level ${x.level==='error'?'bad':x.level==='warn'?'warn':x.level==='info'?'ok':''}">${x.level}</span><span class="component">${esc(x.component||'core')}</span><span>${esc(x.message)}</span><span class="fields">${esc(JSON.stringify(x.fields||{}))}</span></div>`).join('');$('#log-list').scrollTop=$('#log-list').scrollHeight}
	['#log-level','#log-component','#log-search'].forEach(id=>$(id).addEventListener('input',renderLogs));$('#log-pause').onclick=()=>{paused=!paused;$('#log-pause').textContent=paused?'继续':'暂停';if(!paused)renderLogs()};function esc(v){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}boot();
  </script>
</body>
</html>
